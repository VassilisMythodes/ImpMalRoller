[package]
name = "impmal-odds"
version = "0.1.0"
edition = "2024"

[dependencies]
# glow (OpenGL) instead of the default wgpu: much smaller build for a 2D chart app.
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.36"

# Browser build only: lets main() find the canvas and start the app.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "HtmlCanvasElement"] }
